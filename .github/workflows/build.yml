name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android klasörünü oluştur
        run: |
          set -ex
          mkdir -p /tmp/keep
          cp pubspec.yaml /tmp/keep/pubspec.yaml
          cp -r lib /tmp/keep/lib
          flutter create --platforms=android --org com.bono --project-name bono_ceviri .
          cp /tmp/keep/pubspec.yaml pubspec.yaml
          rm -rf lib && cp -r /tmp/keep/lib lib
          rm -rf test

      - name: Gradle yaması (AGP 8.11.1 + Kotlin 2.2.20)
        run: bash tools/patch_android.sh

      - name: İzinleri ekle (internet + dosya erişimi)
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          grep -n "uses-permission" android/app/src/main/AndroidManifest.xml

      - name: Paketleri indir
        run: flutter pub get

      - name: APK derle
        run: flutter build apk --release --target-platform android-arm,android-arm64

      - name: APK yükle
        uses: actions/upload-artifact@v4
        with:
          name: bono-ceviri-apk
          path: build/app/outputs/flutter-apk/app-release.apk
